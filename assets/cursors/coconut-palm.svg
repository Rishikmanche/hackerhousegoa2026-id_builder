<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Trunk gradients -->
    <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A522A"/>
      <stop offset="40%" stop-color="#A86E3C"/>
      <stop offset="70%" stop-color="#D49B5B"/>
      <stop offset="100%" stop-color="#6E3E1A"/>
    </linearGradient>
    <linearGradient id="trunkShade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DDA366"/>
      <stop offset="35%" stop-color="#B47740"/>
      <stop offset="80%" stop-color="#78441D"/>
      <stop offset="100%" stop-color="#542D0F"/>
    </linearGradient>
    <!-- Coconut gradients -->
    <radialGradient id="cocoGrad1" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#8F5B34"/>
      <stop offset="40%" stop-color="#653B1C"/>
      <stop offset="90%" stop-color="#3E200C"/>
      <stop offset="100%" stop-color="#281305"/>
    </radialGradient>
    <radialGradient id="cocoGrad2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#9C663D"/>
      <stop offset="45%" stop-color="#6F4120"/>
      <stop offset="100%" stop-color="#331808"/>
    </radialGradient>
    <!-- Frond Gradients -->
    <!-- Center top frond -->
    <linearGradient id="frondTop" x1="20%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#187A38"/>
      <stop offset="30%" stop-color="#2DBE56"/>
      <stop offset="70%" stop-color="#5CE47E"/>
      <stop offset="100%" stop-color="#86F4A0"/>
    </linearGradient>
    <!-- Left top frond -->
    <linearGradient id="frondLeftTop" x1="80%" y1="80%" x2="0%" y2="10%">
      <stop offset="0%" stop-color="#11662C"/>
      <stop offset="35%" stop-color="#26B24D"/>
      <stop offset="75%" stop-color="#4FE074"/>
      <stop offset="100%" stop-color="#79F297"/>
    </linearGradient>
    <!-- Left outer frond -->
    <linearGradient id="frondLeftLow" x1="90%" y1="50%" x2="0%" y2="30%">
      <stop offset="0%" stop-color="#0F5926"/>
      <stop offset="40%" stop-color="#1FA344"/>
      <stop offset="80%" stop-color="#42D167"/>
      <stop offset="100%" stop-color="#6EE68E"/>
    </linearGradient>
    <!-- Right top frond -->
    <linearGradient id="frondRightTop" x1="10%" y1="80%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#126B2E"/>
      <stop offset="30%" stop-color="#24BA4E"/>
      <stop offset="70%" stop-color="#53E578"/>
      <stop offset="100%" stop-color="#8AFAB0"/>
    </linearGradient>
    <!-- Right lower frond -->
    <linearGradient id="frondRightLow" x1="0%" y1="40%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0C4D20"/>
      <stop offset="35%" stop-color="#1D993E"/>
      <stop offset="75%" stop-color="#3DC45E"/>
      <stop offset="100%" stop-color="#62DC82"/>
    </linearGradient>
    <!-- Back ambient shadow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#021207" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- TRUNK: Smooth graceful curve from top center (34, 25) down to pointer tip (12, 60) -->
    <!-- Base shadow/depth -->
    <path d="M32,24 C33,35 27,46 16,59 C13.5,61.8 9.5,61 10,58 C18,45 25,35 27,24 Z" fill="#381D0A" opacity="0.6"/>
    
    <!-- Main trunk body -->
    <path d="M32.5,23 C33.5,34 27.5,46 16.5,58.5 C15.2,60 12.8,60.8 11.2,59.5 C10.2,58.5 10.6,56.8 11.8,55.2 C20.5,43.5 26.8,33.5 28,23 Z" fill="url(#trunkShade)"/>
    
    <!-- Trunk segments / 3D ridges -->
    <path d="M28.5,27 C29.8,27.8 31.8,28.2 32.8,27.6" stroke="#542D0F" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M26.8,32 C28.2,33 30.5,33.3 31.8,32.4" stroke="#542D0F" stroke-width="1.3" stroke-linecap="round" fill="none"/>
    <path d="M24.2,37 C25.8,38.2 28.5,38.5 30,37.3" stroke="#542D0F" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M21,43 C23,44.4 25.8,44.5 27.2,43.2" stroke="#542D0F" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M17.2,49 C19.2,50.4 22,50.3 23.5,48.8" stroke="#542D0F" stroke-width="1.4" stroke-linecap="round" fill="none"/>
    <path d="M13.5,54.5 C15.5,55.8 18,55.5 19.5,54" stroke="#542D0F" stroke-width="1.3" stroke-linecap="round" fill="none"/>

    <!-- Trunk specular highlight ridge along left contour -->
    <path d="M29,24 C28,34 22.5,44 12.5,56.5" stroke="#F5C48A" stroke-width="0.9" stroke-linecap="round" opacity="0.85" fill="none"/>

    <!-- Pointer hotspot tip indicator (Natural smooth rounded root base) -->
    <ellipse cx="11.5" cy="58.5" rx="2" ry="1.5" fill="#542D0F"/>
    <circle cx="11.2" cy="58.2" r="1" fill="#DDA366"/>

    <!-- COCONUTS (Nestled at crown) -->
    <!-- Back coconut -->
    <circle cx="35.5" cy="24.5" r="4.2" fill="url(#cocoGrad1)"/>
    <circle cx="34.2" cy="23.2" r="1.2" fill="#C28755" opacity="0.6"/>
    <!-- Left coconut -->
    <circle cx="27.5" cy="23" r="4.5" fill="url(#cocoGrad2)"/>
    <circle cx="26" cy="21.8" r="1.3" fill="#D99C6B" opacity="0.7"/>
    <!-- Center front coconut -->
    <circle cx="31.5" cy="26.5" r="4.8" fill="url(#cocoGrad1)"/>
    <circle cx="30" cy="25" r="1.5" fill="#DDA366" opacity="0.75"/>
    <!-- 3 small coconut germination pores -->
    <circle cx="31.5" cy="27" r="0.55" fill="#1A0B03"/>
    <circle cx="33" cy="27.5" r="0.55" fill="#1A0B03"/>
    <circle cx="32.2" cy="28.5" r="0.55" fill="#1A0B03"/>

    <!-- PALM FRONDS (3D Lush Arching Foliage) -->
    
    <!-- 1. Left Lower Frond (Drooping gracefully) -->
    <path d="M28,21 C22,17 12,18 4,25 C2,26.8 2.5,28.5 5,28 C11,26.5 19,25.5 27,24.5 Z" fill="url(#frondLeftLow)"/>
    <!-- Left lower leaflet serrations & highlight -->
    <path d="M27,22 C18,19 10,21 4,26" stroke="#8BF7A9" stroke-width="0.8" fill="none" opacity="0.75"/>

    <!-- 2. Left Upper Frond (High sweep arch) -->
    <path d="M30,19 C23,11 12,10 5,16 C3.2,17.5 4,19.2 6.5,18.8 C13,17.5 21,18 28,21 Z" fill="url(#frondLeftTop)"/>
    <path d="M29,20 C20,13 11,12 5,17" stroke="#A3FAC0" stroke-width="0.9" fill="none" opacity="0.85"/>

    <!-- 3. Center Top Frond (Tallest crown banner) -->
    <path d="M30,18 C28,8 33,2 35,2 C37,2 41,8 38,18 C35,17 33,17 30,18 Z" fill="url(#frondTop)"/>
    <path d="M32,17 C32,9 34,4 35,2.5 C36,4 37,9 36,17" stroke="#C1FED3" stroke-width="1.0" fill="none" opacity="0.9"/>

    <!-- 4. Right Upper Frond (Broad sweeping right arch) -->
    <path d="M34,19 C41,10 52,9 59,15 C61,16.5 60.5,18.5 57.5,18.2 C51,17.2 43,18 36,21 Z" fill="url(#frondRightTop)"/>
    <path d="M35,20 C44,12 53,11 59,16" stroke="#A3FAC0" stroke-width="0.9" fill="none" opacity="0.85"/>

    <!-- 5. Right Lower Frond (Lush tropical dip) -->
    <path d="M36,22 C43,18 53,19 61,26 C62.8,27.8 62,29.5 59.5,29 C53,27.5 45,26.5 37,25 Z" fill="url(#frondRightLow)"/>
    <path d="M37,23 C46,20 54,22 60,27" stroke="#8BF7A9" stroke-width="0.8" fill="none" opacity="0.75"/>

    <!-- Front crown bud / central sprouting leaf -->
    <path d="M31,21 C30,15 33,12 34,12 C35,12 37,15 35,21 Z" fill="#6EF090"/>
    <circle cx="33.5" cy="14" r="0.8" fill="#FFFFFF" opacity="0.7"/>
  </g>
</svg>